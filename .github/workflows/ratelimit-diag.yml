name: Rate Limit Diagnostic (TEMP)

# TEMPORARY, throwaway workflow used to read Henrik's real rate-limit headers
# from a non-sinkholed runner. Uses its OWN concurrency group so it runs in
# parallel with the main refresh (does not queue behind it), and runs refresh.mjs
# in DIAG_PROBE mode which never touches the shared accumulator/release asset.
# Delete after tuning DELAY_MS.

on:
  workflow_dispatch:

concurrency:
  group: valorant-ratelimit-diag
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Probe Henrik rate limit (na)
        env:
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
          DEBUG_RATELIMIT: '1'
          DIAG_PROBE: '1'
          REGION: na
          MAX_PLAYERS: '8'
        run: node refresh.mjs
