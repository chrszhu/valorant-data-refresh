name: Valorant Data Refresh

on:
  schedule:
    # Weekly, Mondays 06:00 UTC. Keeps the competitive meta fresh week to week.
    # The accumulator dedups matches and auto-prunes old ones, so runs stay cheap
    # + bounded. (Swiftplay has its own separate weekly run on Thursdays.)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      max_players:
        description: 'Players per region (default 500, 0 = no cap)'
        required: false
        type: string
      attempt:
        description: 'Internal: auto-continue pass counter (leave blank)'
        required: false
        type: string
      regions:
        description: 'JSON array of regions to run, e.g. ["na"] (blank = all)'
        required: false
        type: string
      debug_econ:
        description: 'Set to 1 to dump the first round economy structure once'
        required: false
        type: string

# Only one run at a time — all runs share the single accumulator release asset
# and the Henrik API rate limit. A new run (including an auto-continue) waits for
# the current one to finish, then resumes from the saved accumulator.
concurrency:
  group: valorant-data-refresh
  cancel-in-progress: false

permissions:
  contents: write # commit data/static + manage the accumulator release

jobs:
  # One job PER region so each gets its own ~6h budget. Henrik's shared key is
  # heavily throttled, so a single all-regions job burned its whole budget on NA
  # and timed out before reaching the others. Sequential (max-parallel: 1) so the
  # jobs don't race on the shared accumulator release asset. Progress is
  # checkpointed to the release every 50 players, so a timeout never loses work.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # just under GitHub's hard 6h per-job cap
    strategy:
      matrix:
        region: ${{ fromJSON(inputs.regions || '["na","eu","ap","kr","br","latam"]') }}
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Fetch ${{ matrix.region }}
        env:
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_ONLY: '1'
          REGION: ${{ matrix.region }}
          MAX_PLAYERS: ${{ inputs.max_players || '1000' }}
          DEBUG_ECON: ${{ inputs.debug_econ || '' }}
        run: node refresh.mjs

  # Build the static bundles from the full accumulator and commit them. Runs even
  # if some region job hit its timeout (if: always()), so we always publish
  # whatever data was collected this pass.
  build:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build static bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPUTE_ONLY: '1'
        run: node refresh.mjs
      - name: Commit static bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/static
          if git diff --cached --quiet; then
            echo "No bundle changes to commit"
            exit 0
          fi
          # data/static is fully regenerated and authoritative (single writer,
          # concurrency-guarded), so never merge/conflict on it — just replay our
          # freshly built bundles on top of the latest main. checkout leaves us on
          # a detached HEAD, so reset the base to origin/main and push HEAD:main.
          git fetch origin main
          git reset --soft origin/main
          git add data/static
          if git diff --cached --quiet; then
            echo "Bundles already up to date on main"
            exit 0
          fi
          git commit -m "Data refresh: update static bundles"
          git push origin HEAD:main

  # Auto-continue: if ANY region didn't finish within its budget (timed out),
  # start a fresh run to pick up where we left off (the accumulator + per-50
  # checkpoints mean it resumes, not restarts). Loops until a pass where every
  # region completes, then stops — the weekly schedule takes over from there.
  # Capped at 8 passes as a runaway guard. Requires a GH_PAT secret because the
  # default GITHUB_TOKEN is not allowed to trigger another workflow run.
  continue:
    needs: [fetch, build]
    # Only auto-continue full (unscoped) scheduled/manual runs — never targeted
    # single-region or debug runs (those set `regions`), so a probe/backfill can't
    # spawn a runaway loop.
    if: always() && needs.fetch.result != 'success' && inputs.regions == '' && fromJSON(inputs.attempt || '1') < 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Continue unfinished work
        # Inputs are passed via env (never interpolated into the shell body) to
        # avoid script injection through workflow_dispatch inputs.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MAX_PLAYERS_IN: ${{ inputs.max_players || '1000' }}
          ATTEMPT_IN: ${{ inputs.attempt || '1' }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No GH_PAT secret set — can't auto-continue. The weekly"
            echo "::warning::schedule will resume the remaining work instead."
            exit 0
          fi
          next=$(( ATTEMPT_IN + 1 ))
          echo "A region did not finish within its budget — continuing (pass $next)."
          gh workflow run refresh.yml \
            -f max_players="$MAX_PLAYERS_IN" \
            -f attempt="$next" \
            -R "$REPO"
