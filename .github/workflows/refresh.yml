name: Valorant Data Refresh

on:
  schedule:
    # Daily, 06:00 UTC. Keeps the meta up to date within a day. The accumulator
    # dedups matches and auto-prunes old ones, so daily runs stay cheap + bounded.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      max_players:
        description: 'Players per region (default 500, 0 = no cap)'
        required: false
        type: string

# Only one run at a time — all runs share the single accumulator release asset
# and the Henrik API rate limit. A new run waits for the current one to finish.
concurrency:
  group: valorant-data-refresh
  cancel-in-progress: false

permissions:
  contents: write # commit data/static + manage the accumulator release

jobs:
  # One job PER region so each gets its own time budget. Henrik's shared key is
  # heavily throttled, so a single all-regions job burned its whole budget on NA
  # and timed out before reaching the others. Sequential (max-parallel: 1) so the
  # jobs don't race on the shared accumulator release asset.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        region: [na, eu, ap, kr, br, latam]
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Fetch ${{ matrix.region }}
        env:
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_ONLY: '1'
          REGION: ${{ matrix.region }}
          MAX_PLAYERS: ${{ inputs.max_players || '500' }}
        run: node refresh.mjs

  # Build the static bundles from the full accumulator and commit them. Runs even
  # if some region job hit its timeout (if: always()), so we always publish
  # whatever data was collected.
  build:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build static bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPUTE_ONLY: '1'
        run: node refresh.mjs
      - name: Commit static bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/static
          if git diff --cached --quiet; then
            echo "No bundle changes to commit"
          else
            git commit -m "Daily data refresh: update static bundles"
            git pull --rebase --autostash origin main || true
            git push
          fi
