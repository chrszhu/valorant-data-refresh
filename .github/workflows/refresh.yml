name: Valorant Data Refresh

on:
  schedule:
    # Weekly, Monday 06:00 UTC. One snapshot a week over the top ~1000 players.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      max_players:
        description: 'Players per region (default 1000, 0 = no cap)'
        required: false
        type: string

# Only one run at a time — all runs share the single accumulator release asset
# and the Henrik API rate limit. A new run waits for the current one to finish.
concurrency:
  group: valorant-data-refresh
  cancel-in-progress: false

permissions:
  contents: write # commit data/static + manage the accumulator release

jobs:
  refresh:
    runs-on: ubuntu-latest
    # All six regions sequentially: ~1000 players * 2.5s * 6 ≈ 4.5h of fetching.
    # The accumulator is uploaded after each region, so a timeout only loses the
    # in-progress region; the next run resumes. Public repo = unlimited minutes.
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh data + build static bundles
        env:
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_PLAYERS: ${{ inputs.max_players }}
        run: node refresh.mjs

      - name: Commit static bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/static
          if git diff --cached --quiet; then
            echo "No bundle changes to commit"
          else
            git commit -m "Weekly data refresh: update static bundles"
            git push
          fi
