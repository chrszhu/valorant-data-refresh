name: Valorant Data Refresh

on:
  schedule:
    # Daily at 6 AM UTC — public repo = unlimited free minutes
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Single region to refresh (leave empty for all)'
        required: false
        type: string

# Only one refresh run at a time — regions share one API key/rate limit, so
# overlapping runs would collide. A new run waits for the current one to finish.
concurrency:
  group: valorant-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Public repo = unlimited minutes; only cap is GitHub's 6h/job hard limit.
    # 350 min gives each region room to complete a full Immortal+ scan.
    timeout-minutes: 350
    strategy:
      matrix:
        region: [na, eu, ap, kr, br, latam]
      max-parallel: 1
      fail-fast: false

    steps:
      - name: Check if manual single-region run
        if: inputs.region != '' && matrix.region != inputs.region
        run: echo "Skipping ${{ matrix.region }} (manual run for ${{ inputs.region }} only)" && exit 0

      - name: Checkout repository
        if: inputs.region == '' || matrix.region == inputs.region
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.region == '' || matrix.region == inputs.region
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: inputs.region == '' || matrix.region == inputs.region
        run: npm ci

      - name: Refresh ${{ matrix.region }}
        if: inputs.region == '' || matrix.region == inputs.region
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
          REGION: ${{ matrix.region }}
        run: node refresh.mjs
